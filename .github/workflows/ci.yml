name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec biome check src

  backend:
    name: Backend (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

  contracts:
    name: Smart Contracts (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sc
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vv

  sdk:
    name: circlo-sdk (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # circlo-types must be built first so its dist/ exists when the SDK
      # imports it via the file: install below. dist/ is gitignored.
      - name: Build circlo-types (so dist/ exists for SDK install)
        working-directory: packages/circlo-types
        run: |
          npm install --no-save typescript@^5.7.3
          npm run build

      - name: Install SDK dependencies (no-save so package.json stays clean)
        working-directory: packages/circlo-sdk
        run: npm install --no-save ../circlo-types typescript@^5.7.3 viem@^2.48.0

      - name: Build SDK
        working-directory: packages/circlo-sdk
        run: npm run build

      - name: Test SDK
        working-directory: packages/circlo-sdk
        run: npm test
